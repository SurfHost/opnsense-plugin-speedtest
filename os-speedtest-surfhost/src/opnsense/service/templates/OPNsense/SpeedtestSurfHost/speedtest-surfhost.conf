{# Settings for speedtest.py and install_backend.sh. Every value is
   validated by the model (option list, integer range, interface name), so
   none of them can carry a line break or an '=' into this file. #}
{% if helpers.exists('OPNsense.SpeedtestSurfHost.general') %}
{% set general = OPNsense.SpeedtestSurfHost.general %}
{% else %}
{% set general = {} %}
{% endif %}
[general]
backend={{ general.backend|default('cli') }}
accept_ookla_terms={{ general.acceptOoklaTerms|default('0') }}
server_id={{ general.serverId|default('') }}
{% if general.interface|default('') != '' %}
device={{ helpers.physical_interface(general.interface) }}
{% else %}
device=
{% endif %}
retention_days={{ general.retentionDays|default('365') }}
